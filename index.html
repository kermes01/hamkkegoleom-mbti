<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>함께걸음 조합원 성향 테스트 (MBTI)</title>
  <style>
    :root {
      --primary: #2B7A78;
      --primary-light: #DEF2F1;
      --primary-dark: #17252A;
      --accent: #3AAFA9;
      --bg: #F8FAF9;
      --card-bg: #FFFFFF;
      --text: #2D3748;
      --text-muted: #718096;
      --border: #E2E8F0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif; }
    body { background-color: var(--bg); color: var(--text); line-height: 1.6; padding: 20px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 680px; }
    
    .card {
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      padding: 32px 24px;
      margin-bottom: 24px;
      border: 1px solid var(--border);
    }
    
    /* Intro */
    .intro { text-align: center; }
    .badge { display: inline-block; background: var(--primary-light); color: var(--primary); padding: 4px 12px; border-radius: 20px; font-weight: 600; font-size: 0.85rem; margin-bottom: 12px; }
    h1 { font-size: 1.6rem; color: var(--primary-dark); margin-bottom: 12px; word-break: keep-all; }
    p.desc { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 24px; word-break: keep-all; }
    .start-btn {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 14px 36px;
      border-radius: 30px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .start-btn:hover { background: var(--accent); transform: translateY(-2px); }

    /* Test Area */
    #test-area { display: none; }
    .progress-bar-container {
      background: #EDF2F7;
      border-radius: 10px;
      height: 8px;
      overflow: hidden;
      margin-bottom: 20px;
    }
    .progress-bar {
      background: linear-gradient(90deg, var(--accent), var(--primary));
      height: 100%;
      width: 0%;
      transition: width 0.3s ease;
    }
    .q-count { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 8px; font-weight: 600; }
    .part-title { font-size: 0.9rem; color: var(--primary); font-weight: 700; margin-bottom: 6px; }
    .q-text { font-size: 1.15rem; font-weight: 700; color: var(--primary-dark); margin-bottom: 24px; word-break: keep-all; }
    
    .option-btn {
      width: 100%;
      text-align: left;
      padding: 18px 20px;
      margin-bottom: 12px;
      background: #fff;
      border: 2px solid var(--border);
      border-radius: 14px;
      font-size: 0.98rem;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 12px;
      word-break: keep-all;
    }
    .option-btn:hover {
      border-color: var(--accent);
      background-color: var(--primary-light);
      transform: translateY(-1px);
    }
    .option-btn .opt-badge {
      font-weight: bold;
      color: var(--primary);
      background: #E6FFFA;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* Result Area */
    #result-area { display: none; text-align: center; }
    .result-header { margin-bottom: 20px; }
    .result-badge {
      display: inline-block;
      background: var(--primary);
      color: #fff;
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }
    .result-title { font-size: 1.7rem; color: var(--primary-dark); margin-bottom: 8px; font-weight: 800; }
    .result-summary { color: #4A5568; font-size: 1.05rem; margin-bottom: 24px; word-break: keep-all; font-weight: 500; }
    
    .score-breakdown {
      display: flex;
      justify-content: space-around;
      background: #F7FAFC;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 24px;
      border: 1px solid var(--border);
    }
    .score-item { font-size: 0.85rem; color: var(--text-muted); }
    .score-item strong { display: block; font-size: 1.1rem; color: var(--primary-dark); margin-top: 4px; }
    
    .section-box {
      text-align: left;
      background: #FFFFFF;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px 20px;
      margin-bottom: 16px;
    }
    .section-box h3 {
      font-size: 1rem;
      color: var(--primary);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .section-box ul { padding-left: 20px; color: #4A5568; }
    .section-box li { margin-bottom: 6px; word-break: keep-all; }

    .restart-btn {
      margin-top: 16px;
      background: #EDF2F7;
      color: var(--text);
      border: none;
      padding: 12px 28px;
      border-radius: 24px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .restart-btn:hover { background: #E2E8F0; }
  </style>
</head>
<body>

<div class="container">
  <!-- 1. Intro Screen -->
  <div id="intro-area" class="card intro">
    <span class="badge">함께걸음의료복지사회적협동조합</span>
    <h1>조합원 성향 테스트 (MBTI)</h1>
    <p class="desc">
      나의 활동 성향을 33개 문항으로 가볍게 알아보고,<br>
      함께걸음에서 나와 꼭 맞는 활동과 모임을 찾아보세요!
    </p>
    <button class="start-btn" onclick="startTest()">테스트 시작하기</button>
  </div>

  <!-- 2. Test Question Screen -->
  <div id="test-area" class="card">
    <div class="progress-bar-container">
      <div id="progress" class="progress-bar"></div>
    </div>
    <div class="q-count"><span id="curr-q">1</span> / 33</div>
    <div id="part-title" class="part-title">Part 1. 만남과 에너지</div>
    <div id="q-text" class="q-text">질문 내용이 여기에 들어옵니다.</div>
    <button class="option-btn" onclick="selectOption('A')">
      <span class="opt-badge">A</span>
      <span id="optA-text">선택지 A 내용</span>
    </button>
    <button class="option-btn" onclick="selectOption('B')">
      <span class="opt-badge">B</span>
      <span id="optB-text">선택지 B 내용</span>
    </button>
  </div>

  <!-- 3. Result Screen -->
  <div id="result-area" class="card">
    <div class="result-header">
      <span class="badge">나의 조합 캐릭터</span><br>
      <div id="res-code" class="result-badge">EFP</div>
      <h2 id="res-title" class="result-title">햇살 같은 분위기 메이커</h2>
      <p id="res-summary" class="result-summary">사람과 웃음이 있는 곳이라면 어디든 달려가는 활력소!</p>
    </div>

    <div class="score-breakdown">
      <div class="score-item">에너지 성향<strong id="score-e">E형</strong></div>
      <div class="score-item">판단/소통 기준<strong id="score-t">F형</strong></div>
      <div class="score-item">활동 진행 스타일<strong id="score-j">P형</strong></div>
    </div>

    <div class="section-box">
      <h3>✨ 이런 성향을 가지고 계시네요</h3>
      <ul id="res-traits"></ul>
    </div>

    <div class="section-box">
      <h3>🤝 찰떡궁합 추천 조합 활동</h3>
      <ul id="res-activities"></ul>
    </div>

    <button class="restart-btn" onclick="restartTest()">다시 검사하기</button>
  </div>
</div>

<script>
const questions = [
  // Part 1: E vs I (1 ~ 11)
  { part: "Part 1. 만남과 에너지", q: "1. 조합 잔치나 축제 날, 나의 모습은?", a: "북적북적한 곳에서 여기저기 인사 나누고 수다 떨어야 힘이 난다.", b: "잠깐 얼굴을 비추며 인사한 뒤, 조용한 자리에서 편한 사람과 담소 나누는 게 좋다.", dim: "EI", optA: "E", optB: "I" },
  { part: "Part 1. 만남과 에너지", q: "2. 조합 단체 대화방(밴드/단톡방)에 새로운 공지가 떴을 때 나는?", a: "이모티콘이나 댓글로 바로바로 반응하며 분위기를 띄운다.", b: "내용을 조용히 확인하고 마음속으로 '좋아요'를 누른다.", dim: "EI", optA: "E", optB: "I" },
  { part: "Part 1. 만남과 에너지", q: "3. 주말 조합 걷기 모임에 처음 보는 새 조합원이 왔다면?", a: "'어디서 오셨어요?' 먼저 다가가 말을 걸고 자연스럽게 말을 튼다.", b: "먼저 말을 걸어올 때까지 기다리며 따뜻한 미소로 맞아준다.", dim: "EI", optA: "E", optB: "I" },
  { part: "Part 1. 만남과 에너지", q: "4. 일주일 동안 조합 활동이나 모임 일정이 빽빽하다면?", a: "'사람들 자주 만나고 활기차서 신난다!'", b: "'모임은 좋지만… 혼자만의 충전 시간이 부족해서 조금 지친다.'", dim: "EI", optA: "E", optB: "I" },
  { part: "Part 1. 만남과 에너지", q: "5. 조합원 정기 총회나 큰 행사가 끝난 후 나의 상태는?", a: "'오늘 재밌었다! 뒤풀이 갈 사람 누구 없나?'", b: "'오늘 사람을 많이 만났으니, 집에서 푹 쉬어야겠다.'", dim: "EI", optA: "E", optB: "I" },
  { part: "Part 1. 만남과 에너지", q: "6. 조합 활동 중 좋은 아이디어가 번쩍 떠올랐을 때?", a: "동료 조합원들에게 바로 꺼내 말하며 대화 속에서 구체화한다.", b: "혼자 머릿속으로 충분히 생각을 정리해 본 뒤에 조심스럽게 꺼낸다.", dim: "EI", optA: "E", optB: "I" },
  { part: "Part 1. 만남과 에너지", q: "7. 조합에서 나를 더 잘 표현하는 자리는?", a: "마이크를 잡고 사회를 보거나 앞에서 분위기를 이끄는 자리.", b: "뒤편에서 음향, 준비물, 차분한 지원을 묵묵히 챙기는 자리.", dim: "EI", optA: "E", optB: "I" },
  { part: "Part 1. 만남과 에너지", q: "8. 가입한 지 얼마 안 된 새 조합원이 적응할 때 필요한 것은?", a: "'빨리 여러 모임에 나와서 사람들을 사귀어봐야 해!'", b: "'부담 갖지 않고 천천히 관심 있는 것부터 둘러보는 게 좋아.'", dim: "EI", optA: "E", optB: "I" },
  { part: "Part 1. 만남과 에너지", q: "9. 모임 도중 잠시 10분의 쉬는 시간이 주어졌을 때?", a: "옆 사람, 뒷자리 사람과 간식을 나누며 대화를 이어간다.", b: "바깥바람을 쐬거나 핸드폰을 보며 혼자만의 숨을 고른다.", dim: "EI", optA: "E", optB: "I" },
  { part: "Part 1. 만남과 에너지", q: "10. 내가 선호하는 조합 소모임의 규모는?", a: "10~20명 이상 모여서 왁자지껄 북적이는 대규모 모임.", b: "3~5명 정도 모여 깊은 이야기를 나눌 수 있는 아담한 모임.", dim: "EI", optA: "E", optB: "I" },
  { part: "Part 1. 만남과 에너지", q: "11. 조합에 대한 애정이 가장 샘솟는 순간은?", a: "다 함께 모여 환호하고 구호를 외치며 연대감을 느낄 때.", b: "소소한 도움을 조용히 건네고 마음이 통했음을 느낄 때.", dim: "EI", optA: "E", optB: "I" },

  // Part 2: T vs F (12 ~ 22)
  { part: "Part 2. 판단과 소통 기준", q: "12. 조합 회의 중 이견이 생겨 논쟁이 벌어졌을 때 나는?", a: "회칙, 객관적인 데이터와 효율성을 기준으로 따져본다.", b: "누구 하나 마음 상하거나 소외되지 않는지 분위기와 감정을 살핀다.", dim: "TF", optA: "T", optB: "F" },
  { part: "Part 2. 판단과 소통 기준", q: "13. 열심히 준비한 행사에서 뜻밖의 실수가 발생했을 때?", a: "'원인이 뭐지? 대책과 수습 방법부터 찾자.'", b: "'진행한 조합원분이 얼마나 속상할까, 먼저 다독여줘야지.'", dim: "TF", optA: "T", optB: "F" },
  { part: "Part 2. 판단과 소통 기준", q: "14. 조합원이 고민 상담을 해왔을 때 내 첫 반응은?", a: "실질적인 해결책과 현실적인 대안을 찾아 조언해 준다.", b: "'그랬구나, 정말 속상했겠다' 하며 충분히 공감하고 들어준다.", dim: "TF", optA: "T", optB: "F" },
  { part: "Part 2. 판단과 소통 기준", q: "15. 조합 예산 결산안을 살펴볼 때 내 시선이 먼저 가는 곳은?", a: "숫자가 정확히 맞는지, 지출 대비 사업 성과가 분명한지.", b: "조합원 복지와 이웃의 온기가 필요한 곳에 정성껏 쓰였는지.", dim: "TF", optA: "T", optB: "F" },
  { part: "Part 2. 판단과 소통 기준", q: "16. 조합원으로서 다른 사람에게 듣고 싶은 최고의 칭찬은?", a: "'역시 일 처리가 똑 부러지고 정확하시네요!'", b: "'덕분에 늘 마음이 편안하고 위로가 돼요!'", dim: "TF", optA: "T", optB: "F" },
  { part: "Part 2. 판단과 소통 기준", q: "17. 함께 활동하는 동료 조합원이 약속 시간에 늦었을 때?", a: "지각이 반복되면 모임 전체 일정과 룰이 흐트러져 신경이 쓰인다.", b: "'혹시 무슨 급한 일이나 어려운 사정이 생겼나' 걱정이 앞선다.", dim: "TF", optA: "T", optB: "F" },
  { part: "Part 2. 판단과 소통 기준", q: "18. 모임에서 거절하기 곤란한 부탁을 받았을 때?", a: "내 여건과 기준에 안 맞으면 정중하지만 분명하게 거절한다.", b: "부탁한 사람의 입장이 딱해서 거절하지 못하고 고민한다.", dim: "TF", optA: "T", optB: "F" },
  { part: "Part 2. 판단과 소통 기준", q: "19. 조합의 새로운 규칙을 정할 때 가장 중요한 것은?", a: "예외 없이 누구에게나 공정하고 투명하게 적용되는 원칙.", b: "취약하거나 사정이 어려운 분들을 배려하는 유연한 포용.", dim: "TF", optA: "T", optB: "F" },
  { part: "Part 2. 판단과 소통 기준", q: "20. 다른 조합원의 활동에 피드백을 전달해야 할 때?", a: "고쳐야 할 점을 솔직하고 명확하게 짚어주는 것이 진짜 도움이다.", b: "상대방이 상처받지 않도록 좋은 점을 먼저 칭찬하고 조심스럽게 말한다.", dim: "TF", optA: "T", optB: "F" },
  { part: "Part 2. 판단과 소통 기준", q: "21. 조합에서 어떤 새 사업을 추진할 때 더 중요한 기준은?", a: "이 사업이 조합 운영에 실질적인 이득과 효율을 가져오는가?", b: "이 사업이 조합원들 사이의 유대감과 행복을 키워주는가?", dim: "TF", optA: "T", optB: "F" },
  { part: "Part 2. 판단과 소통 기준", q: "22. 모임이 끝나고 집에 갈 때 보람을 느끼는 순간은?", a: "'오늘 계획했던 안건과 일처리가 군더더기 없이 끝났다!'", b: "'오늘 참여한 사람들 표정이 다들 밝고 훈훈했다!'", dim: "TF", optA: "T", optB: "F" },

  // Part 3: J vs P (23 ~ 33)
  { part: "Part 3. 활동 진행 방식", q: "23. 조합 나들이나 소풍을 갈 때 나의 스타일은?", a: "출발 시간, 이동 동선, 식당 예약까지 미리 정해둬야 마음이 편하다.", b: "'일단 출발하고, 그날 기분과 날씨에 맞춰 재미있게 즐기자!'", dim: "JP", optA: "J", optB: "P" },

let currentIdx = 0;
let scores = { E: 0, I: 0, T: 0, F: 0, J: 0, P: 0 };

function startTest() {
  document.getElementById('intro-area').style.display = 'none';
  document.getElementById('result-area').style.display = 'none';
  document.getElementById('test-area').style.display = 'block';
  currentIdx = 0;
  scores = { E: 0, I: 0, T: 0, F: 0, J: 0, P: 0 };
  showQuestion();
}

function showQuestion() {
  const item = questions[currentIdx];
  document.getElementById('curr-q').innerText = currentIdx + 1;
  document.getElementById('part-title').innerText = item.part;
  document.getElementById('q-text').innerText = item.q;
  document.getElementById('optA-text').innerText = item.a;
  document.getElementById('optB-text').innerText = item.b;

  const progressPct = ((currentIdx) / questions.length) * 100;
  document.getElementById('progress').style.width = progressPct + '%';
}

function selectOption(choice) {
  const item = questions[currentIdx];
  const selectedCode = (choice === 'A') ? item.optA : item.optB;
  scores[selectedCode]++;

  currentIdx++;
  if (currentIdx < questions.length) {
    showQuestion();
  } else {
    showResult();
  }
}

function showResult() {
  document.getElementById('test-area').style.display = 'none';
  document.getElementById('result-area').style.display = 'block';

  const eType = (scores.E >= scores.I) ? 'E' : 'I';
  const tType = (scores.T >= scores.F) ? 'T' : 'F';
  const jType = (scores.J >= scores.P) ? 'J' : 'P';
  const resultCode = eType + tType + jType;

  const data = resultsData[resultCode];

  document.getElementById('res-code').innerText = resultCode;
  document.getElementById('res-title').innerText = data.title;
  document.getElementById('res-summary').innerText = data.summary;

  document.getElementById('score-e').innerText = `${eType}형 (${scores.E} : ${scores.I})`;
  document.getElementById('score-t').innerText = `${tType}형 (${scores.T} : ${scores.F})`;
  document.getElementById('score-j').innerText = `${jType}형 (${scores.J} : ${scores.P})`;

  const traitsUl = document.getElementById('res-traits');
  traitsUl.innerHTML = '';
  data.traits.forEach(t => {
    const li = document.createElement('li');
    li.innerText = t;
    traitsUl.appendChild(li);
  });

  const actUl = document.getElementById('res-activities');
  actUl.innerHTML = '';
  data.activities.forEach(a => {
    const li = document.createElement('li');
    li.innerText = a;
    actUl.appendChild(li);
  });
}

function restartTest() {
  startTest();
}
